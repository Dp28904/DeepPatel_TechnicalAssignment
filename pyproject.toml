[project]
name = "sales-order-inventory"
version = "0.1.0"
description = "Sales Order & Inventory Management (Savyant Systems technical assignment)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI uses Depends()/Query() in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests", "debugging"]
addopts = "-ra"
