{% extends "base.html" %}
{% block title %}Products{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Products</h1>
  {% if user.is_admin %}<a class="btn btn-primary" href="/products/new">+ New product</a>{% endif %}
</div>

<form id="filters" class="toolbar card" role="search">
  <div class="field grow">
    <label for="search">Search</label>
    <input id="search" name="search" type="search" placeholder="Product code or name" maxlength="100">
  </div>
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category"><option value="">All categories</option></select>
  </div>
  {% if user.is_admin %}
  <div class="field">
    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="all">All</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
  {% endif %}
</form>

<div id="form-error" class="alert alert-error" role="alert" hidden></div>

<div class="card table-card">
  <table class="data-table">
    <thead>
      <tr><th>Code</th><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th>Status</th><th></th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
  </table>
  <div id="pager" class="pager"></div>
</div>
{% endblock %}

{% block scripts %}<script type="module" src="/static/js/products_list.js"></script>{% endblock %}
