<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sales &amp; Inventory logo">
  <title>Sales &amp; Inventory</title>
  <defs>
    <linearGradient id="si-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="si-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="16" fill="url(#si-tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#si-shine)"/>

  <!-- Inventory: an isometric box (lid, left face, right face) -->
  <path d="M32 12 L50 22 L32 32 L14 22 Z" fill="#ffffff"/>
  <path d="M14 22 L32 32 L32 52 L14 42 Z" fill="#dbeafe"/>
  <path d="M32 32 L50 22 L50 42 L32 52 Z" fill="#93c5fd"/>
  <!-- Packing tape, kept inside the lid -->
  <path d="M24.5 17.8 L39.5 26.2" stroke="#bfdbfe" stroke-width="3"/>

  <!-- Sales: one rising line with its arrowhead. The dark outline is drawn first for
       the whole shape, then the amber stroke on top, so there are no seams. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 49 L21 42.5 L30 46.5 L50 28.5 M42.5 28 L51 27.2 L50.2 35.6" stroke="#1e3a8a" stroke-width="6.5"/>
    <path d="M11 49 L21 42.5 L30 46.5 L50 28.5 M42.5 28 L51 27.2 L50.2 35.6" stroke="#fbbf24" stroke-width="3.2"/>
  </g>
</svg>
