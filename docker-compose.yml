services:
  mysql:
    image: mysql:8.4
    container_name: sales_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-sales_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sales_app_pw}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The web application. `docker compose up --build` starts MySQL and the app together.
  # For local development without Docker for the app, start only MySQL:
  #   docker compose up -d mysql
  app:
    build: .
    image: sales-inventory-app:latest
    container_name: sales_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the service name "mysql".
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-sales_app}:${MYSQL_PASSWORD:-sales_app_pw}@mysql:3306/${MYSQL_DATABASE:-sales_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (copy .env.example to .env first)}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  mysql_data:
